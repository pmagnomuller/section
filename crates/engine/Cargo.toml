[package]
name = "section-engine"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Drum and bass rhythm section engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.130", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
